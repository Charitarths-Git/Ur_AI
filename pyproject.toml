[project]
name = "jp-balance-sheet-parser"
version = "0.1.0"
description = "Parse Japanese consolidated balance sheets (連結貸借対照表) from PDF into structured CSV/JSON."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.25.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
